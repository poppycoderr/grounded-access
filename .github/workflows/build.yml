name: build

on:
  push:
    branches: [ main ]
  # Every pull request, including ones stacked on another feature branch
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the minimum supported version, 25 the current LTS
        java: [ '21', '25' ]
    name: control-plane (java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      # verify runs unit tests, Testcontainers integration tests and the Spotless check
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7
          if-no-files-found: ignore

  model-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/model-service
    env:
      GA_MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
      GA_RUN_MODEL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: model-weights-${{ hashFiles('apps/model-service/src/model_service/settings.py') }}

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Download model
        run: uv run python -m model_service.download

      - name: Test
        run: uv run pytest

  # Branch protection requires a single check named build; it summarizes every job above
  build:
    runs-on: ubuntu-latest
    needs: [ control-plane, model-service ]
    if: always()
    steps:
      - name: Require every job to pass
        run: |
          test "${{ needs.control-plane.result }}" = "success"
          test "${{ needs.model-service.result }}" = "success"

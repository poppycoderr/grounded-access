name: build

on:
  push:
    branches: [ main ]
  # Every pull request, including ones stacked on another feature branch
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the minimum supported version, 25 the current LTS
        java: [ '21', '25' ]
    name: control-plane (java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      # verify runs unit tests, Testcontainers integration tests and the Spotless check
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7
          if-no-files-found: ignore

  model-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/model-service
    env:
      GA_MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
      GA_RUN_MODEL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: model-weights-${{ hashFiles('apps/model-service/src/model_service/settings.py') }}

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Download model
        run: uv run python -m model_service.download

      - name: Test
        run: uv run pytest

  evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/evaluation
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Validate dataset
        run: uv run ga-eval validate

  # Relative links and heading anchors in every tracked Markdown file; no network involved
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        run: python3 scripts/check-links.py

  # Starts the whole stack, loads the demo corpus and runs the retrieval evaluation; any unauthorized result fails the job
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Runs the quick start exactly as the README prints it: start the stack, load the corpus, the demo queries, the benchmark with
      # its security gate, a search and a token-authenticated API call
      - name: Run the README quick start
        shell: bash
        run: |
          python3 scripts/readme-commands.py README.md --same-as README.zh-CN.md
          python3 scripts/readme-commands.py README.md | bash -euo pipefail | tee quickstart.log
          tail -c 4000 quickstart.log | grep -q '"results":\[{'

      # More clients than database connections, every result checked against its principal's visible set
      - name: Load smoke test
        run: ./scripts/load-smoke --strategy sparse-only --strategy dense-only --strategy hybrid-rrf --workers 16 --requests 600 --out results/load

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: results
          if-no-files-found: ignore

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color --tail 200

  # Branch protection requires a single check named build; it summarizes every job above
  build:
    runs-on: ubuntu-latest
    needs: [ control-plane, model-service, evaluation, docs, smoke ]
    if: always()
    steps:
      - name: Require every job to pass
        run: |
          test "${{ needs.control-plane.result }}" = "success"
          test "${{ needs.model-service.result }}" = "success"
          test "${{ needs.evaluation.result }}" = "success"
          test "${{ needs.docs.result }}" = "success"
          test "${{ needs.smoke.result }}" = "success"

name: grounded-access

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: grounded_access
      POSTGRES_USER: grounded_access
      POSTGRES_PASSWORD: grounded_access
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grounded_access -d grounded_access"]
      interval: 5s
      timeout: 3s
      retries: 20

  model-service:
    build: apps/model-service
    ports:
      - "8000:8000"

  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    environment:
      GA_DB_URL: jdbc:postgresql://postgres:5432/grounded_access
      GA_MODEL_SERVICE_URL: http://model-service:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      model-service:
        condition: service_healthy

volumes:
  postgres-data:

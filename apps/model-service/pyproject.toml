[project]
name = "model-service"
version = "0.1.0"
description = "Embedding service for Grounded Access; holds no identities and no database access"
license = "Apache-2.0"
authors = [
    { name = "Elijah Du", email = "poppycoder@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "huggingface-hub>=1.32.0",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
# fastembed caps pillow below 13, and the fixes for the pillow advisories of October 2026 are only in 13. The service loads text models only:
# pillow is imported by fastembed but never handles input. Remove the override once fastembed allows pillow 13.
override-dependencies = ["pillow>=13.0.0"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

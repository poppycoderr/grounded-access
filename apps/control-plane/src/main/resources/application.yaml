spring:
  application:
    name: grounded-access
  datasource:
    url: ${GA_DB_URL:jdbc:postgresql://localhost:5432/grounded_access}
    username: ${GA_DB_USER:grounded_access}
    password: ${GA_DB_PASSWORD:grounded_access}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        size: 2

ga:
  identity:
    issuer: ${GA_JWT_ISSUER:grounded-access-demo}
    audience: ${GA_JWT_AUDIENCE:grounded-access}
    public-key: ${GA_JWT_PUBLIC_KEY:classpath:demo-keys/jwt-public.pem}
  model-service:
    base-url: ${GA_MODEL_SERVICE_URL:http://localhost:8000}
    embedding-model: ${GA_EMBEDDING_MODEL:BAAI/bge-small-en-v1.5}
    batch-size: 64
    connect-timeout: 2s
    read-timeout: 30s
  retrieval:
    candidates: 50
    rrf-k: 60
  corpus:
    chunk-max-words: 180
    chunk-overlap-words: 30
    cleanup:
      enabled: ${GA_CORPUS_CLEANUP_ENABLED:true}
      interval: 1m
      batch-size: 100
  ingestion:
    worker:
      enabled: ${GA_INGESTION_WORKER_ENABLED:true}
      poll-interval: 1s
      lease: 5m
      max-attempts: 5
      retry-backoff: 5s

management:
  endpoints:
    web:
      exposure:
        include: health

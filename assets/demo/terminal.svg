n:k30 30s linear infinite}@keyframes k31{0%,65.40%{opacity:0}65.80%,98.33%{opacity:1}98.73%,100%{opacity:0}}.l31{animation:k31 30s linear infinite}@keyframes k32{0%,66.13%{opacity:0}66.53%,98.33%{opacity:1}98.73%,100%{opacity:0}}.l32{animation:k32 30s linear infinite}@keyframes k33{0%,66.87%{opacity:0}67.27%,98.33%{opacity:1}98.73%,100%{opacity:0}}.l33{animation:k33 30s linear infinite}@keyframes k34{0%,67.60%{opacity:0}68.00%,98.33%{opacity:1}98.73%,100%{opacity:0}}.l34{animation:k34 30s linear infinite}@media (prefers-reduced-motion:reduce){.l{animation:none!important}.l0,.l1,.l2,.l3,.l4,.l5,.l6,.l7,.l8,.l9,.l10,.l11,.l12{opacity:1}}</style><rect width="900" height="298" rx="10" fill="#0d1117"/><rect width="900" height="34" rx="10" fill="#161b22"/><rect y="24" width="900" height="10" fill="#161b22"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="450" y="21" text-anchor="middle" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">grounded-access</text><text class="l l0" font-size="12" x="22" y="58" fill="#e6edf3" xml:space="preserve">$ ./scripts/demo-queries</text><text class="l l1" font-size="12" x="22" y="76" fill="#d29922" xml:space="preserve">== Same question, two tenants ==</text><text class="l l2" font-size="12" x="22" y="94" fill="#58a6ff" xml:space="preserve">alice-engineer (tenant northstar) · dense-only · policy abac/1</text><text class="l l3" font-size="12" x="22" y="112" fill="#e6edf3" xml:space="preserve">  1. hr-volunteer-policy › Volunteer Time Off Policy &gt; European Union</text><text class="l l4" font-size="12" x="22" y="130" fill="#8b949e" xml:space="preserve">     Employees based in the EU receive two paid volunteer days per calendar year. Unused volunteer days do not carr</text><text class="l l5" font-size="12" x="22" y="148" fill="#e6edf3" xml:space="preserve">  2. hr-volunteer-policy › Volunteer Time Off Policy &gt; United States</text><text class="l l6" font-size="12" x="22" y="166" fill="#8b949e" xml:space="preserve">     Employees based in the US receive one paid volunteer day per calendar year. Managers may approve one additiona</text><text class="l l7" font-size="12" x="22" y="184" fill="#58a6ff" xml:space="preserve">mallory-outsider (tenant external) · dense-only · policy abac/1</text><text class="l l8" font-size="12" x="22" y="202" fill="#e6edf3" xml:space="preserve">  1. volunteer-handbook › Community Volunteering Handbook &gt; Volunteer days</text><text class="l l9" font-size="12" x="22" y="220" fill="#8b949e" xml:space="preserve">     Orbit Labs employees receive three volunteer days per year, which can be taken as half days.</text><text class="l l10" font-size="12" x="22" y="238" fill="#e6edf3" xml:space="preserve">  2. volunteer-handbook › Community Volunteering Handbook &gt; Approval</text><text class="l l11" font-size="12" x="22" y="256" fill="#8b949e" xml:space="preserve">     Team leads approve volunteer days in the Orbit Labs people system.</text><text class="l l12" font-size="12" x="22" y="274" fill="#3fb950" xml:space="preserve"># the outsider&#x27;s rows never include a Northstar document</text><text class="l l13" font-size="12" x="22" y="58" fill="#d29922" xml:space="preserve">== Same tenant, different clearance ==</text><text class="l l14" font-size="12" x="22" y="76" fill="#58a6ff" xml:space="preserve">alice-engineer (tenant northstar) · dense-only · policy abac/1</text><text class="l l15" font-size="12" x="22" y="94" fill="#e6edf3" xml:space="preserve">  1. eng-oncall-handbook › On-call Handbook &gt; Compensation</text><text class="l l16" font-size="12" x="22" y="112" fill="#8b949e" xml:space="preserve">     Engineers receive an on-call allowance of 250 EUR per week of primary on-call, plus time off in lieu for any p</text><text class="l l17" font-size="12" x="22" y="130" fill="#e6edf3" xml:space="preserve">  2. eng-oncall-handbook › On-call Handbook &gt; Acknowledging pages</text><text class="l l18" font-size="12" x="22" y="148" fill="#8b949e" xml:space="preserve">     The on-call engineer must acknowledge a page within 5 minutes. If a page is not acknowledged within 15 minutes</text><text class="l l19" font-size="12" x="22" y="166" fill="#58a6ff" xml:space="preserve">carol-manager (tenant northstar) · dense-only · policy abac/1</text><text class="l l20" font-size="12" x="22" y="184" fill="#e6edf3" xml:space="preserve">  1. hr-compensation-bands › Compensation Bands &gt; On-call pay</text><text class="l l21" font-size="12" x="22" y="202" fill="#8b949e" xml:space="preserve">     Engineers at staff level and above receive an on-call allowance of 400 EUR per week of primary on-call instead</text><text class="l l22" font-size="12" x="22" y="220" fill="#e6edf3" xml:space="preserve">  2. eng-oncall-handbook › On-call Handbook &gt; Compensation</text><text class="l l23" font-size="12" x="22" y="238" fill="#8b949e" xml:space="preserve">     Engineers receive an on-call allowance of 250 EUR per week of primary on-call, plus time off in lieu for any p</text><text class="l l24" font-size="12" x="22" y="256" fill="#3fb950" xml:space="preserve"># same tenant, same question: only the token differs</text><text class="l l25" font-size="12" x="22" y="58" fill="#e6edf3" xml:space="preserve">$ ./scripts/benchmark</text><text class="l l26" font-size="12" x="22" y="76" fill="#c9d1d9" xml:space="preserve">## Results (test split)</text><text class="l l27" font-size="11" x="22" y="94" fill="#c9d1d9" xml:space="preserve">| Strategy            | Cases | Recall@5           | Recall@10          | MRR@10             | nDCG@10            | Violations |</text><text class="l l28" font-size="11" x="22" y="112" fill="#c9d1d9" xml:space="preserve">| ------------------- | ----- | ------------------ | ------------------ | ------------------ | ------------------ | --- |</text><text class="l l29" font-size="11" x="22" y="130" fill="#c9d1d9" xml:space="preserve">| `sparse-only`       | 70    | 0.850 [0.76, 0.93] | 0.929 [0.86, 0.99] | 0.690 [0.60, 0.77] | 0.749 [0.67, 0.82] | 0 |</text><text class="l l30" font-size="11" x="22" y="148" fill="#c9d1d9" xml:space="preserve">| `dense-only`        | 70    | 0.936 [0.87, 0.99] | 0.971 [0.93, 1.00] | 0.865 [0.80, 0.93] | 0.892 [0.83, 0.94] | 0 |</text><text class="l l31" font-size="11" x="22" y="166" fill="#c9d1d9" xml:space="preserve">| `hybrid-rrf`        | 70    | 0.957 [0.90, 1.00] | 0.971 [0.93, 1.00] | 0.825 [0.75, 0.89] | 0.860 [0.80, 0.91] | 0 |</text><text class="l l32" font-size="11" x="22" y="184" fill="#c9d1d9" xml:space="preserve">| `hybrid-rrf-rerank` | 70    | 0.957 [0.91, 0.99] | 0.971 [0.93, 1.00] | 0.957 [0.91, 0.99] | 0.955 [0.91, 0.99] | 0 |</text><text class="l l33" font-size="11" x="22" y="202" fill="#c9d1d9" xml:space="preserve">| `bm25-reference`    | 70    | 0.864 [0.79, 0.94] | 0.921 [0.86, 0.98] | 0.741 [0.66, 0.82] | 0.784 [0.71, 0.86] | 0 |</text><text class="l l34" font-size="12" x="22" y="220" fill="#3fb950" xml:space="preserve"># 0 unauthorized results in every row, so the security gate passes</text></svg>

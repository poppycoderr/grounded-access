<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 570" width="1050" height="570"
     role="img" aria-labelledby="ttl dsc" style="max-width:100%;height:auto">
  <title id="ttl">One compiled predicate governs both retrieval channels</title>
  <desc id="dsc">Java owns identity, authorization and retrieval; Python owns model work; the evaluation CLI drives the same public API.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="ar-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-s" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,Roboto,sans-serif}
    .bg{fill:#FBFCFE}
    .title{font-size:26px;font-weight:700;fill:#0F172A;letter-spacing:-.2px}
    .sub{font-size:13.5px;font-weight:400;fill:#64748B}
    .kicker{font-size:11px;font-weight:700;fill:#94A3B8;letter-spacing:1.4px}
    .lbl{font-size:15px;font-weight:650;fill:#0F172A}
    .lbl-sm{font-size:13px;font-weight:650;fill:#0F172A}
    .txt{font-size:12px;font-weight:400;fill:#64748B}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:500;fill:#334155}
    .edgelbl{font-size:11px;font-weight:500;fill:#94A3B8}
    .card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1.25}
    .group{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:1.25}
    .blue{fill:#EFF6FF;stroke:#BFDBFE;stroke-width:1.25}
    .teal{fill:#F0FDFA;stroke:#99F6E4;stroke-width:1.25}
    .violet{fill:#F5F3FF;stroke:#DDD6FE;stroke-width:1.25}
    .amber{fill:#FFFBEB;stroke:#FDE68A;stroke-width:1.25}
    .rose{fill:#FFF1F2;stroke:#FECDD3;stroke-width:1.25}
    .planned{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.25;stroke-dasharray:5 4}
    .edge{stroke:#94A3B8;stroke-width:1.5;fill:none}
    .edge-strong{stroke:#6366F1;stroke-width:2;fill:none}
    .mk{fill:#94A3B8}
    .mk-s{fill:#6366F1}
    .pill{fill:#EEF2FF;stroke:#C7D2FE;stroke-width:1}
    .pill-ok{fill:#ECFDF5;stroke:#A7F3D0;stroke-width:1}
    .pill-bad{fill:#FFF1F2;stroke:#FECDD3;stroke-width:1}
    .pill-txt{font-size:11px;font-weight:650;fill:#4338CA}
    .pill-txt-ok{font-size:11px;font-weight:650;fill:#047857}
    .pill-txt-bad{font-size:11px;font-weight:650;fill:#BE123C}
  </style>
  <rect class="bg" x="0" y="0" width="1050" height="570" rx="16"/>
  <text class="kicker" x="40" y="44">GROUNDED ACCESS · v0.1</text>
  <text class="title" x="40" y="74">One compiled predicate governs both retrieval channels</text>
  <text class="sub" x="40" y="98">Java owns identity, authorization and retrieval; Python owns model work; the evaluation CLI drives the same public API.</text>
  <rect class="card" x="40" y="128" width="186" height="74" rx="11"/>
  <text class="lbl-sm" x="56" y="153">Query user</text>
  <text class="txt" x="56" y="174">demo JWT, scope query</text>
  <rect class="card" x="40" y="228" width="186" height="74" rx="11"/>
  <text class="lbl-sm" x="56" y="253">Corpus maintainer</text>
  <text class="txt" x="56" y="274">manifest, scope admin</text>
  <rect class="card" x="40" y="328" width="186" height="74" rx="11"/>
  <text class="lbl-sm" x="56" y="353">ga-eval CLI</text>
  <text class="txt" x="56" y="374">one token per principal</text>
  <rect class="group" x="300" y="112" width="424" height="404" rx="14"/>
  <text class="lbl-sm" x="316" y="136">Control plane · Java / Spring Boot</text>
  <rect class="blue" x="316" y="150" width="392" height="70" rx="11"/>
  <text class="lbl-sm" x="332" y="175">identity</text>
  <text class="txt" x="332" y="196">verify JWT · iss / aud</text>
  <text class="mono" x="332" y="213">requires sub + tenant_id</text>
  <rect class="violet" x="316" y="232" width="392" height="70" rx="11"/>
  <text class="lbl-sm" x="332" y="257">authorization</text>
  <text class="txt" x="332" y="278">PolicyCompiler → one SQL predicate</text>
  <text class="mono" x="332" y="295">policy version recorded per query</text>
  <rect class="teal" x="316" y="314" width="392" height="70" rx="11"/>
  <text class="lbl-sm" x="332" y="339">retrieval</text>
  <text class="txt" x="332" y="360">PostgreSQL FTS + pgvector</text>
  <text class="mono" x="332" y="377">RRF fusion · M1</text>
  <rect class="amber" x="316" y="396" width="392" height="70" rx="11"/>
  <text class="lbl-sm" x="332" y="421">corpus</text>
  <text class="txt" x="332" y="442">normalize · heading-aware chunks</text>
  <text class="mono" x="332" y="459">content hash → new version</text>
  <rect class="planned" x="316" y="478" width="392" height="52" rx="11"/>
  <text class="lbl-sm" x="332" y="503">answering · M3</text>
  <text class="txt" x="332" y="524">citations · abstention</text>
  <rect class="card" x="790" y="150" width="236" height="92" rx="11"/>
  <text class="lbl-sm" x="806" y="175">PostgreSQL 17 + pgvector</text>
  <text class="txt" x="806" y="196">authorization runs inside</text>
  <text class="txt" x="806" y="213">the retrieval query</text>
  <rect class="card" x="790" y="274" width="236" height="92" rx="11"/>
  <text class="lbl-sm" x="806" y="299">model-service · Python</text>
  <text class="txt" x="806" y="320">receives authorized text only</text>
  <text class="txt" x="806" y="337">embed now · rerank in M3 · CPU</text>
  <rect class="planned" x="790" y="398" width="236" height="70" rx="11"/>
  <text class="lbl-sm" x="806" y="423">local chat model</text>
  <text class="txt" x="806" y="444">optional, no API key needed</text>
  <path class="edge-strong" d="M226 165 L296 165" marker-end="url(#ar-s)"/>
  <text class="edgelbl" x="261" y="156" text-anchor="middle">search</text>
  <path class="edge" d="M226 265 L296 265" marker-end="url(#ar)"/>
  <text class="edgelbl" x="261" y="256" text-anchor="middle">ingest</text>
  <path class="edge" d="M226 365 L296 365" marker-end="url(#ar)"/>
  <text class="edgelbl" x="261" y="356" text-anchor="middle">evaluate</text>
  <path class="edge-strong" d="M512 220 L512 246" marker-end="url(#ar-s)"/>
  <path class="edge-strong" d="M512 302 L512 328" marker-end="url(#ar-s)"/>
  <path class="edge-strong" d="M726 196 L786 196" marker-end="url(#ar-s)"/>
  <path class="edge" d="M726 320 L786 320" marker-end="url(#ar)"/>
  <path class="edge" d="M726 433 L786 433" marker-end="url(#ar)"/>
  <text class="txt" x="40" y="548" >Unauthorized rows never leave PostgreSQL  ·  hidden and missing content look identical  ·  every evaluation run is reproducible</text>
</svg>

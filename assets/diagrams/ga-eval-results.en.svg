<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600"
     role="img" aria-labelledby="ttl dsc" style="max-width:100%;height:auto">
  <title id="ttl">Reranking puts the evidence first; plain hybrid does not beat dense</title>
  <desc id="dsc">Dataset v4, test split, 70 answerable cases. Bars are MRR@10 with 95% bootstrap intervals, from the committed CI run.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="ar-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-v" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,Roboto,sans-serif;}
    .bg{fill:#FBFCFE}
    .kicker{font-size:11.5px;font-weight:700;fill:#94A3B8;letter-spacing:1.4px}
    .title{font-size:26px;font-weight:700;fill:#0F172A;letter-spacing:-.2px}
    .sub{font-size:14px;fill:#64748B}
    .lbl{font-size:15px;font-weight:650;fill:#0F172A}
    .lbl-sm{font-size:13.5px;font-weight:650;fill:#0F172A}
    .txt{font-size:12.5px;fill:#64748B}
    .txt-d{font-size:12.5px;fill:#334155}
    .foot{font-size:12.5px;fill:#64748B}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:500;fill:#334155}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#E2E8F0}
    .codek{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#7DD3FC}
    .num{font-size:13px;font-weight:650;fill:#0F172A}
    .big{font-size:30px;font-weight:700;fill:#0F172A}
    .bigok{font-size:30px;font-weight:700;fill:#059669}
    .card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1.25}
    .dash{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.25;stroke-dasharray:5 4}
    .group{fill:#F1F5F9;fill-opacity:.55;stroke:#E2E8F0;stroke-width:1.25}
    .blue{fill:#EFF6FF;stroke:#BFDBFE;stroke-width:1.25}
    .teal{fill:#F0FDFA;stroke:#99F6E4;stroke-width:1.25}
    .violet{fill:#F5F3FF;stroke:#DDD6FE;stroke-width:1.25}
    .amber{fill:#FFFBEB;stroke:#FDE68A;stroke-width:1.25}
    .rose{fill:#FFF1F2;stroke:#FECDD3;stroke-width:1.25}
    .green{fill:#ECFDF5;stroke:#A7F3D0;stroke-width:1.25}
    .dark{fill:#0F172A}
    .ln{stroke:#94A3B8;stroke-width:1.5;fill:none}
    .ln-v{stroke:#6366F1;stroke-width:1.75;fill:none}
    .mk{fill:#94A3B8}.mk-v{fill:#6366F1}
    .bar-s{fill:#38BDF8}.bar-d{fill:#6366F1}.bar-h{fill:#A78BFA}.bar-x{fill:#10B981}.bar-r{fill:#CBD5E1}
    .axis{stroke:#E2E8F0;stroke-width:1}
    .whisk{stroke:#0F172A;stroke-width:1.5}
    .pill-ok{fill:#D1FAE5}.pill-ok-t{font-size:11.5px;font-weight:700;fill:#047857}
    .pill-now{fill:#E0E7FF}.pill-now-t{font-size:11.5px;font-weight:700;fill:#4338CA}
    .pill-next{fill:#F1F5F9}.pill-next-t{font-size:11.5px;font-weight:700;fill:#64748B}
  </style>
  <rect class="bg" width="1120" height="600" rx="18"/>
  <text class="kicker" x="40" y="44">GROUNDED ACCESS · EVALUATION</text>
  <text class="title" x="40" y="76">Reranking puts the evidence first; plain hybrid does not beat dense</text>
  <text class="sub" x="40" y="101">Dataset v4, test split, 70 answerable cases. Bars are MRR@10 with 95% bootstrap intervals, from the committed CI run.</text>
  <text class="kicker" x="290" y="142">MRR@10</text>
  <text class="kicker" x="980" y="142">Recall@10</text>
  <line class="axis" x1="290" y1="152" x2="290" y2="436"/>
  <text class="txt" x="290" y="454" text-anchor="middle">0</text>
  <line class="axis" x1="425.0" y1="152" x2="425.0" y2="436"/>
  <text class="txt" x="425.0" y="454" text-anchor="middle">0.25</text>
  <line class="axis" x1="560.0" y1="152" x2="560.0" y2="436"/>
  <text class="txt" x="560.0" y="454" text-anchor="middle">0.5</text>
  <line class="axis" x1="695.0" y1="152" x2="695.0" y2="436"/>
  <text class="txt" x="695.0" y="454" text-anchor="middle">0.75</text>
  <line class="axis" x1="830.0" y1="152" x2="830.0" y2="436"/>
  <text class="txt" x="830.0" y="454" text-anchor="middle">1</text>
  <text class="mono" x="40" y="179">sparse-only</text>
  <text class="txt" x="40" y="197">PostgreSQL full-text search</text>
  <rect class="bar-s" x="290" y="162" width="400" height="30" rx="6"/>
  <path class="whisk" d="M646.4000000000001 177 L732.8 177 M646.4000000000001 171 v12 M732.8 171 v12"/>
  <text class="num" x="744.8" y="182">0.740  [0.66, 0.82]</text>
  <text class="num" x="980" y="182">0.943</text>
  <text class="mono" x="40" y="233">dense-only</text>
  <text class="txt" x="40" y="251">exact pgvector search</text>
  <rect class="bar-d" x="290" y="216" width="483" height="30" rx="6"/>
  <path class="whisk" d="M743.5999999999999 231 L803.0 231 M743.5999999999999 225 v12 M803.0 225 v12"/>
  <text class="num" x="815.0" y="236">0.895  [0.84, 0.95]</text>
  <text class="num" x="980" y="236">0.979</text>
  <text class="mono" x="40" y="287">hybrid-rrf</text>
  <text class="txt" x="40" y="305">reciprocal rank fusion of the two</text>
  <rect class="bar-h" x="290" y="270" width="468" height="30" rx="6"/>
  <path class="whisk" d="M722.0 285 L792.2 285 M722.0 279 v12 M792.2 279 v12"/>
  <text class="num" x="804.2" y="290">0.867  [0.80, 0.93]</text>
  <text class="num" x="980" y="290">0.986</text>
  <text class="mono" x="40" y="341">hybrid-rrf-rerank</text>
  <text class="txt" x="40" y="359">cross-encoder over the fused top 20</text>
  <rect class="bar-x" x="290" y="324" width="524" height="30" rx="6"/>
  <path class="whisk" d="M797.5999999999999 339 L830.0 339 M797.5999999999999 333 v12 M830.0 333 v12"/>
  <text class="num" x="842.0" y="344">0.971  [0.94, 1.00]</text>
  <text class="num" x="980" y="344">0.986</text>
  <text class="mono" x="40" y="395">bm25-reference</text>
  <text class="txt" x="40" y="413">offline reference row</text>
  <rect class="bar-r" x="290" y="378" width="417" height="30" rx="6"/>
  <path class="whisk" d="M662.5999999999999 393 L749.0 393 M662.5999999999999 387 v12 M749.0 387 v12"/>
  <text class="num" x="761.0" y="398">0.772  [0.69, 0.85]</text>
  <text class="num" x="980" y="398">0.943</text>
  <rect class="green" x="40" y="476" width="330" height="70" rx="12"/>
  <text class="bigok" x="58" y="522">0</text>
  <text class="lbl-sm" x="89" y="510">unauthorized results</text>
  <text class="txt" x="89" y="529">across 128 cases and every strategy</text>
  <rect class="card" x="390" y="476" width="330" height="70" rx="12"/>
  <text class="big" x="408" y="522">31</text>
  <text class="lbl-sm" x="458" y="510">authorization negatives</text>
  <text class="txt" x="458" y="529">tenant, clearance, project, department</text>
  <rect class="card" x="740" y="476" width="330" height="70" rx="12"/>
  <text class="big" x="758" y="522">+0.08</text>
  <text class="lbl-sm" x="865" y="510">rerank vs dense, MRR@10</text>
  <text class="txt" x="865" y="529">[+0.03, +0.13], at 11× the latency</text>
  <text class="foot" x="40" y="576">Source: benchmarks/reports/heading-context. A demo benchmark on a small fictional corpus, not a claim about production quality.</text>
</svg>

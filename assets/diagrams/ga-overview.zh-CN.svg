<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600"
     role="img" aria-labelledby="ttl dsc" style="max-width:100%;height:auto">
  <title id="ttl">一个编译好的谓词管住所有检索路径</title>
  <desc id="dsc">Java 负责身份、授权与检索；Python 负责模型计算；评测 CLI 走的是同一套公开 API。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="ar-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-v" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,Roboto,sans-serif;}
    .bg{fill:#FBFCFE}
    .kicker{font-size:11.5px;font-weight:700;fill:#94A3B8;letter-spacing:1.4px}
    .title{font-size:26px;font-weight:700;fill:#0F172A;letter-spacing:-.2px}
    .sub{font-size:14px;fill:#64748B}
    .lbl{font-size:15px;font-weight:650;fill:#0F172A}
    .lbl-sm{font-size:13.5px;font-weight:650;fill:#0F172A}
    .txt{font-size:12.5px;fill:#64748B}
    .txt-d{font-size:12.5px;fill:#334155}
    .foot{font-size:12.5px;fill:#64748B}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:500;fill:#334155}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#E2E8F0}
    .codek{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#7DD3FC}
    .num{font-size:13px;font-weight:650;fill:#0F172A}
    .big{font-size:30px;font-weight:700;fill:#0F172A}
    .bigok{font-size:30px;font-weight:700;fill:#059669}
    .card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1.25}
    .dash{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.25;stroke-dasharray:5 4}
    .group{fill:#F1F5F9;fill-opacity:.55;stroke:#E2E8F0;stroke-width:1.25}
    .blue{fill:#EFF6FF;stroke:#BFDBFE;stroke-width:1.25}
    .teal{fill:#F0FDFA;stroke:#99F6E4;stroke-width:1.25}
    .violet{fill:#F5F3FF;stroke:#DDD6FE;stroke-width:1.25}
    .amber{fill:#FFFBEB;stroke:#FDE68A;stroke-width:1.25}
    .rose{fill:#FFF1F2;stroke:#FECDD3;stroke-width:1.25}
    .green{fill:#ECFDF5;stroke:#A7F3D0;stroke-width:1.25}
    .dark{fill:#0F172A}
    .ln{stroke:#94A3B8;stroke-width:1.5;fill:none}
    .ln-v{stroke:#6366F1;stroke-width:1.75;fill:none}
    .mk{fill:#94A3B8}.mk-v{fill:#6366F1}
    .bar-s{fill:#38BDF8}.bar-d{fill:#6366F1}.bar-h{fill:#A78BFA}.bar-x{fill:#10B981}.bar-r{fill:#CBD5E1}
    .axis{stroke:#E2E8F0;stroke-width:1}
    .whisk{stroke:#0F172A;stroke-width:1.5}
    .pill-ok{fill:#D1FAE5}.pill-ok-t{font-size:11.5px;font-weight:700;fill:#047857}
    .pill-now{fill:#E0E7FF}.pill-now-t{font-size:11.5px;font-weight:700;fill:#4338CA}
    .pill-next{fill:#F1F5F9}.pill-next-t{font-size:11.5px;font-weight:700;fill:#64748B}
  </style>
  <rect class="bg" width="1120" height="600" rx="18"/>
  <text class="kicker" x="40" y="44">GROUNDED ACCESS · v0.1</text>
  <text class="title" x="40" y="76">一个编译好的谓词管住所有检索路径</text>
  <text class="sub" x="40" y="101">Java 负责身份、授权与检索；Python 负责模型计算；评测 CLI 走的是同一套公开 API。</text>
  <rect class="card" x="40" y="172" width="210" height="66" rx="12"/>
  <text class="lbl-sm" x="56" y="197">查询用户</text>
  <text class="txt" x="56" y="217">demo JWT，scope query</text>
  <path class="ln-v" d="M250 205 L298 205" marker-end="url(#ar-v)"/>
  <text class="txt" x="274" y="196" text-anchor="middle">检索</text>
  <rect class="card" x="40" y="276" width="210" height="66" rx="12"/>
  <text class="lbl-sm" x="56" y="301">语料维护者</text>
  <text class="txt" x="56" y="321">文档 + 标签，scope admin</text>
  <path class="ln" d="M250 309 L298 309" marker-end="url(#ar)"/>
  <text class="txt" x="274" y="300" text-anchor="middle">入库</text>
  <rect class="card" x="40" y="380" width="210" height="66" rx="12"/>
  <text class="lbl-sm" x="56" y="405">ga-eval CLI</text>
  <text class="txt" x="56" y="425">每个身份一个 token</text>
  <path class="ln" d="M250 413 L298 413" marker-end="url(#ar)"/>
  <text class="txt" x="274" y="404" text-anchor="middle">评测</text>
  <rect class="group" x="300" y="128" width="440" height="414" rx="16"/>
  <text class="lbl" x="318" y="155">控制面 · Java / Spring Boot</text>
  <rect class="blue" x="318" y="170" width="404" height="62" rx="12"/>
  <text class="lbl-sm" x="334" y="195">identity</text>
  <text class="txt" x="334" y="215">验签 JWT · 必须带 sub 与 tenant_id</text>
  <path class="ln-v" d="M520 232 L520 242" marker-end="url(#ar-v)"/>
  <rect class="violet" x="318" y="243" width="404" height="62" rx="12"/>
  <text class="lbl-sm" x="334" y="268">authorization</text>
  <text class="txt" x="334" y="288">PolicyCompiler → 一个 SQL 谓词 · policy abac/1</text>
  <path class="ln-v" d="M520 305 L520 315" marker-end="url(#ar-v)"/>
  <rect class="teal" x="318" y="316" width="404" height="62" rx="12"/>
  <text class="lbl-sm" x="334" y="341">retrieval</text>
  <text class="txt" x="334" y="361">PostgreSQL FTS · pgvector · RRF · 重排 · 配置哈希</text>
  <rect class="amber" x="318" y="389" width="404" height="62" rx="12"/>
  <text class="lbl-sm" x="334" y="414">corpus + ingestion</text>
  <text class="txt" x="334" y="434">任务队列 · 切分 · 版本 · 访问标签</text>
  <rect class="rose" x="318" y="462" width="404" height="62" rx="12"/>
  <text class="lbl-sm" x="334" y="487">answering</text>
  <text class="txt" x="334" y="507">上下文 · 引用校验 · 拒答</text>
  <rect class="card" x="800" y="170" width="280" height="84" rx="12"/>
  <text class="lbl-sm" x="816" y="195">PostgreSQL 17 + pgvector</text>
  <text class="txt" x="816" y="215">授权在检索查询内部执行</text>
  <path class="ln-v" d="M740 212 L798 212" marker-end="url(#ar-v)"/>
  <rect class="card" x="800" y="290" width="280" height="84" rx="12"/>
  <text class="lbl-sm" x="816" y="315">model-service · Python</text>
  <text class="txt" x="816" y="335">只接收已授权的文本</text>
  <text class="txt" x="816" y="353">在 CPU 上计算向量与重排</text>
  <path class="ln" d="M740 332 L798 332" marker-end="url(#ar)"/>
  <rect class="dash" x="800" y="410" width="280" height="84" rx="12"/>
  <text class="lbl-sm" x="816" y="435">对话模型 · 可选</text>
  <text class="txt" x="816" y="455">任何兼容 OpenAI 接口的端点</text>
  <text class="txt" x="816" y="473">只能看到已授权的证据</text>
  <path class="ln" d="M740 452 L798 452" marker-end="url(#ar)"/>
  <text class="foot" x="40" y="574">未授权的行不会离开 PostgreSQL  ·  标签变更对下一次查询生效  ·  每次评测都可复现</text>
</svg>
